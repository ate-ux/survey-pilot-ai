services:
  db:
    image: postgres:16-alpine
    container_name: survey_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survey_admin -d survey_pilot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - survey_net

  backend:
    build: ./backend
    container_name: survey_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - survey_net

  frontend:
    build: ./frontend
    container_name: survey_frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT}:8501"
    depends_on:
      - backend
    networks:
      - survey_net

volumes:
  postgres_data:

networks:
  survey_net:
    driver: bridge